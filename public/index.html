<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimbus — cloud console (backend connected)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1120;
        --panel: #111827;
        --panel-alt: #182235;
        --border: #263449;

        --text: #f1f5f9;
        --text2: #94a3b8;
        --text3: #64748b;

        --compute: #22c55e;
        --storage: #f59e0b;
        --database: #a78bfa;
        --network: #38bdf8;
        --security: #fbbf24;
        --monitoring: #34d399;
        --backup: #f472b6;
        --danger: #ef4444;

        --accent: #6366f1;
        --accent-hover: #818cf8;
      }

      body {
        background:
          radial-gradient(
            circle at 80% 0%,
            rgba(99, 102, 241, 0.08),
            transparent 30%
          ),
          var(--bg);
      }

      #sidebar {
        background: rgba(17, 24, 39, 0.95);
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.15);
      }

      #topbar {
        background: rgba(11, 17, 32, 0.92);
        backdrop-filter: blur(10px);
      }

      .nav-item {
        transition: all 0.2s ease;
      }

      .nav-item:hover {
        background: #1e293b;
        transform: translateX(2px);
      }

      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(99, 102, 241, 0.18),
          rgba(99, 102, 241, 0.05)
        );
        border-color: rgba(99, 102, 241, 0.35);
      }

      .btn {
        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-accent {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .btn-accent:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .aws-pill.on {
        background: rgba(52, 211, 153, 0.08);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.12);
      }

      .region-pill {
        background: rgba(255, 255, 255, 0.025);
      }

      .card,
      .panel,
      .table-wrap {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
      a {
        color: inherit;
      }
      #app {
        display: flex;
        min-height: 100vh;
      }
      #sidebar {
        width: 216px;
        flex: 0 0 216px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
      }
      .brand {
        padding: 0 20px 20px 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .brand-mark {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--compute);
      }
      .brand-name {
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .brand-sub {
        color: var(--text3);
        font-size: 12px;
        margin-top: 4px;
      }
      nav {
        flex: 1;
        padding: 8px 10px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 6px;
        color: var(--text2);
        cursor: pointer;
        font-size: 14px;
        border: 1px solid transparent;
      }
      .nav-item:hover {
        background: var(--panel-alt);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--panel-alt);
        color: var(--text);
        border-color: var(--border);
      }
      .nav-swatch {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 8px;
      }
      .sidebar-foot {
        padding: 14px 20px 0 20px;
        border-top: 1px solid var(--border);
        margin-top: 10px;
        color: var(--text3);
        font-size: 12px;
      }
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text2);
        font-size: 13px;
      }
      .region-pill {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        color: var(--text);
        background: var(--panel);
      }
      .aws-pill {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12.5px;
      }
      .aws-pill.on {
        color: var(--monitoring);
        border-color: var(--monitoring);
      }
      .aws-pill.off {
        color: var(--text3);
      }
      .topbar-right {
        display: flex;
        gap: 14px;
        align-items: center;
        color: var(--text2);
        font-size: 13px;
      }
      #content {
        padding: 28px;
        flex: 1;
        overflow-x: hidden;
      }
      .view-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 22px;
        gap: 20px;
      }
      .view-head h1 {
        font-size: 22px;
        margin: 0 0 6px 0;
        font-weight: 600;
      }
      .view-head p {
        margin: 0;
        color: var(--text2);
        font-size: 14px;
        max-width: 520px;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover {
        border-color: var(--text3);
      }
      .btn-accent {
        background: var(--accent, var(--compute));
        color: #0b1210;
        border-color: transparent;
        font-weight: 500;
      }
      .btn-danger {
        color: var(--danger);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12.5px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
        margin-bottom: 26px;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .stat-card .n {
        font-size: 26px;
        font-weight: 600;
      }
      .stat-card .l {
        color: var(--text2);
        font-size: 13px;
        margin-top: 4px;
      }
      .stat-card .bar {
        height: 3px;
        border-radius: 2px;
        margin-top: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      thead th {
        text-align: left;
        font-weight: 500;
        color: var(--text2);
        font-size: 12.5px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-alt);
      }
      tbody td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: var(--panel-alt);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .status .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .empty {
        padding: 34px;
        text-align: center;
        color: var(--text3);
        border: 1px dashed var(--border);
        border-radius: 10px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      .panel h3 {
        margin: 0 0 14px 0;
        font-size: 15px;
        font-weight: 600;
      }
      .form-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
        min-width: 140px;
      }
      .field label {
        font-size: 12.5px;
        color: var(--text2);
      }
      .field input,
      .field select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
      }
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--text3);
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(8, 11, 14, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .modal-bg.active {
        display: flex;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 22px;
        width: 380px;
        max-width: 92vw;
      }
      .modal h3 {
        margin: 0 0 4px 0;
      }
      .modal .sub {
        color: var(--text2);
        font-size: 13px;
        margin-bottom: 16px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 880px) {
        .two-col {
          grid-template-columns: 1fr;
        }
        #sidebar {
          width: 64px;
          flex-basis: 64px;
        }
        .brand-name,
        .brand-sub,
        .nav-item span.label {
          display: none;
        }
        .nav-item {
          justify-content: center;
        }
      }
      .chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        border: 1px solid var(--border);
        color: var(--text2);
      }
      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13.5px;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.25s;
        pointer-events: none;
        z-index: 30;
        max-width: 340px;
      }
      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .note {
        color: var(--text3);
        font-size: 12px;
        margin-top: 4px;
      }

      /* ===== NIMBUS MODERN UI ===== */

      :root {
        --bg: #070b17;
        --panel: #0f1629;
        --panel-alt: #151e35;
        --border: #263252;

        --text: #f8fafc;
        --text2: #9aa8c7;
        --text3: #647292;

        --compute: #00e5a0;
        --storage: #ffb84d;
        --database: #a78bfa;
        --network: #38bdf8;
        --security: #facc15;
        --monitoring: #34d399;
        --backup: #f472b6;
        --danger: #fb5b5b;

        --accent: #7c5cff;
        --accent2: #4f46e5;
      }

      /* Background */
      html,
      body {
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(124, 92, 255, 0.16),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(56, 189, 248, 0.08),
            transparent 30%
          ),
          #070b17;
      }

      /* Main application */
      #app {
        gap: 18px;
        padding: 14px;
      }

      /* Floating sidebar */
      #sidebar {
        width: 230px;
        flex: 0 0 230px;
        background: rgba(15, 22, 41, 0.88);
        border: 1px solid #202b48;
        border-radius: 18px;
        padding: 22px 10px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      /* Brand */
      .brand {
        padding: 4px 14px 22px;
        border-bottom: 1px solid #202b48;
        margin-bottom: 18px;
      }

      .brand-mark {
        gap: 10px;
      }

      .brand-dot {
        width: 11px;
        height: 11px;
        background: #00e5a0;
        box-shadow:
          0 0 8px #00e5a0,
          0 0 18px rgba(0, 229, 160, 0.5);
      }

      .brand-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }

      .brand-sub {
        margin-top: 6px;
        color: #7180a0;
      }

      /* Navigation */
      nav {
        padding: 4px;
      }

      .nav-item {
        padding: 12px 13px;
        margin: 5px 0;
        border-radius: 11px;
        border: 1px solid transparent;
        transition: 0.2s ease;
      }

      .nav-item:hover {
        background: rgba(124, 92, 255, 0.1);
        border-color: rgba(124, 92, 255, 0.18);
        transform: translateX(3px);
      }

      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(124, 92, 255, 0.25),
          rgba(124, 92, 255, 0.07)
        );
        border-color: rgba(124, 92, 255, 0.35);
        color: white;
        box-shadow: inset 3px 0 0 #7c5cff;
      }

      /* Sidebar footer */
      .sidebar-foot {
        border-top: 1px solid #202b48;
        padding: 16px 14px 4px;
        color: #7180a0;
      }

      /* Main */
      #main {
        background: transparent;
      }

      /* Topbar */
      #topbar {
        margin: 0 0 4px;
        padding: 14px 22px;
        border: 1px solid #202b48;
        border-radius: 16px;
        background: rgba(15, 22, 41, 0.75);
        backdrop-filter: blur(18px);
      }

      /* Region */
      .region-pill {
        border-radius: 10px;
        padding: 7px 13px;
        background: rgba(124, 92, 255, 0.09);
        border-color: rgba(124, 92, 255, 0.25);
      }

      /* AWS connected pill */
      .aws-pill {
        border-radius: 10px;
        padding: 7px 13px;
      }

      .aws-pill.on {
        color: #00e5a0;
        border-color: rgba(0, 229, 160, 0.35);
        background: rgba(0, 229, 160, 0.07);
        box-shadow: 0 0 18px rgba(0, 229, 160, 0.08);
      }

      /* Content */
      #content {
        padding: 30px 8px;
      }

      /* Page heading */
      .view-head h1 {
        font-size: 30px;
        letter-spacing: -0.8px;
      }

      .view-head p {
        color: #8290ae;
      }

      /* Buttons */
      .btn {
        border-radius: 10px;
        padding: 10px 17px;
        background: #151e35;
        border-color: #2a3758;
        transition: 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        border-color: #59698f;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .btn-accent {
        background: linear-gradient(135deg, #7c5cff, #4f46e5);
        color: white;
        border: none;
        box-shadow: 0 8px 22px rgba(79, 70, 229, 0.28);
      }

      .btn-accent:hover {
        background: linear-gradient(135deg, #8b6cff, #6366f1);
        box-shadow: 0 10px 28px rgba(99, 102, 241, 0.38);
      }

      /* Dashboard stat cards */
      .card-grid {
        gap: 18px;
      }

      .stat-card {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          145deg,
          rgba(21, 30, 53, 0.95),
          rgba(12, 18, 35, 0.95)
        );
        border: 1px solid #263252;
        border-radius: 16px;
        padding: 21px;
        min-height: 125px;
        transition: 0.25s ease;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        width: 90px;
        height: 90px;
        right: -35px;
        top: -35px;
        border-radius: 50%;
        background: rgba(124, 92, 255, 0.08);
      }

      .stat-card:hover {
        transform: translateY(-5px);
        border-color: rgba(124, 92, 255, 0.45);
        box-shadow:
          0 18px 35px rgba(0, 0, 0, 0.3),
          0 0 25px rgba(124, 92, 255, 0.08);
      }

      .stat-card .n {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .stat-card .l {
        margin-top: 7px;
        color: #8492b1;
      }

      .stat-card .bar {
        height: 4px;
        margin-top: 18px;
        border-radius: 10px;
      }

      /* Panels */
      .panel {
        background: rgba(15, 22, 41, 0.82);
        border: 1px solid #263252;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }

      .panel h3 {
        padding: 18px 20px;
        margin: 0;
        font-size: 16px;
      }

      /* Tables */
      table {
        background: transparent;
        border: none;
      }

      thead th {
        background: rgba(21, 30, 53, 0.8);
        color: #8290ae;
        padding: 13px 16px;
      }

      tbody td {
        padding: 14px 16px;
        border-bottom-color: #202b48;
      }

      tbody tr {
        transition: 0.15s ease;
      }

      tbody tr:hover {
        background: rgba(124, 92, 255, 0.055);
      }

      /* Empty states */
      .empty {
        margin: 18px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.015);
        border-color: #293657;
      }

      /* Chips */
      .chip {
        border-radius: 20px;
        padding: 4px 10px;
        background: rgba(124, 92, 255, 0.08);
        border-color: rgba(124, 92, 255, 0.25);
      }

      /* Modal */
      .modal {
        background: #11182c;
        border: 1px solid #303d60;
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }

      /* Toast */
      #toast {
        background: #151e35;
        border: 1px solid #344263;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #070b17;
      }

      ::-webkit-scrollbar-thumb {
        background: #293657;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #46557a;
      }

      /* ===== NIMBUS PREMIUM UI ===== */

      :root {
        --bg: #08090b;
        --panel: #0f1115;
        --panel2: #151820;
        --border: #222631;

        --text: #f5f7fa;
        --muted: #8b93a1;

        --accent: #7c5cff;
        --accent2: #9b7cff;

        --green: #22c55e;
        --blue: #3b82f6;
        --orange: #f59e0b;
        --pink: #ec4899;
      }

      /* Page */
      html,
      body {
        background:
          radial-gradient(
            circle at 75% 0%,
            rgba(124, 92, 255, 0.1),
            transparent 28%
          ),
          #08090b !important;
        color: var(--text);
      }

      /* Sidebar */
      #sidebar {
        width: 240px;
        flex: 0 0 240px;
        background: rgba(10, 11, 14, 0.92);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(18px);
        padding: 18px 12px;
      }

      /* Brand */
      .brand {
        padding: 10px 12px 22px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }

      .brand-mark {
        gap: 10px;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        box-shadow: 0 0 16px rgba(124, 92, 255, 0.8);
      }

      .brand-name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }

      .brand-sub {
        color: #68707d;
        font-size: 12px;
        margin-top: 4px;
      }

      /* Sidebar navigation */
      .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 3px 0;
        padding: 10px 12px;
        border-radius: 7px;
        color: #9ba3af;
        transition: 0.2s ease;
      }

      .nav-item:hover {
        background: #151820;
        color: white;
      }

      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(124, 92, 255, 0.18),
          rgba(124, 92, 255, 0.05)
        );
        color: white;
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 4px;
        background: #8b5cf6;
        box-shadow: 0 0 12px #8b5cf6;
      }

      .nav-swatch {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        opacity: 0.9;
      }

      /* Main */
      #main {
        background: transparent;
      }

      /* Top bar */
      #topbar {
        height: 64px;
        background: rgba(8, 9, 11, 0.72);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px);
        padding: 0 28px;
      }

      /* Pills */
      .region-pill,
      .aws-pill {
        border-radius: 999px !important;
        padding: 6px 11px !important;
        font-size: 12px !important;
      }

      .region-pill {
        background: #11141a !important;
        border: 1px solid #282d38 !important;
        color: #aeb5c0 !important;
      }

      .aws-pill.on {
        background: rgba(34, 197, 94, 0.08) !important;
        border-color: rgba(34, 197, 94, 0.3) !important;
        color: #4ade80 !important;
      }

      /* Content */
      #content {
        max-width: 1500px;
        margin: auto;
        padding: 38px 42px 60px;
      }

      /* Hero */
      .view-head {
        margin-bottom: 30px;
      }

      .view-head h1 {
        font-size: 32px !important;
        font-weight: 650 !important;
        letter-spacing: -1px;
        margin-bottom: 5px;
      }

      .view-head p {
        color: var(--muted);
        font-size: 14px;
      }

      /* Dashboard hero enhancement */
      .view-head::after {
        content: "";
        display: block;
        height: 1px;
        margin-top: 25px;
        background: linear-gradient(90deg, #2b303b, transparent);
      }

      /* Cards */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat-card {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.01)
          ),
          #101217 !important;

        border: 1px solid #242833 !important;
        border-radius: 12px !important;

        padding: 22px !important;
        min-height: 130px;

        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        border-color: #393f4d !important;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.28);
      }

      .stat-card .n {
        font-size: 30px !important;
        font-weight: 650 !important;
        letter-spacing: -1px;
      }

      .stat-card .l {
        color: #858d9b !important;
        margin-top: 5px;
      }

      .stat-card .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;
        opacity: 0.7;
      }

      /* Panels */
      .panel {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent),
          #101217 !important;

        border: 1px solid #242833 !important;
        border-radius: 12px !important;
        box-shadow: none !important;
      }

      .panel h3 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      /* Two columns */
      .two-col {
        gap: 16px !important;
      }

      /* Tables */
      table {
        border-collapse: collapse;
      }

      thead th {
        background: #151820 !important;
        color: #9da5b2 !important;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      tbody tr {
        transition: background 0.15s;
      }

      tbody tr:hover {
        background: rgba(124, 92, 255, 0.045) !important;
      }

      tbody td {
        border-color: #222631 !important;
        color: #cbd1da;
      }

      /* Buttons */
      .btn {
        border-radius: 7px !important;
        transition: 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-accent {
        background: linear-gradient(135deg, #7c5cff, #6244e8) !important;

        border: none !important;
        color: white !important;

        box-shadow: 0 6px 20px rgba(124, 92, 255, 0.22);
      }

      .btn-accent:hover {
        box-shadow: 0 8px 28px rgba(124, 92, 255, 0.35);
      }

      /* Delete */
      .btn-danger {
        border-color: rgba(224, 104, 91, 0.35) !important;
      }

      /* Status */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .status .dot {
        box-shadow: 0 0 7px currentColor;
      }

      /* Empty state */
      .empty {
        color: #707887;
        padding: 25px 5px;
        font-size: 13px;
      }

      /* Sidebar footer */
      .sidebar-foot {
        color: #555d69 !important;
        font-size: 11px !important;
      }

      /* Toast */
      #toast {
        background: #171a21 !important;
        border: 1px solid #303541 !important;
        border-radius: 9px !important;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      }

      /* Modal */
      .modal {
        background: #111318 !important;
        border: 1px solid #292e39 !important;
        border-radius: 12px !important;
      }

      /* Responsive */
      @media (max-width: 900px) {
        #sidebar {
          width: 190px;
          flex-basis: 190px;
        }

        #content {
          padding: 25px;
        }

        .card-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 650px) {
        #sidebar {
          width: 70px;
          flex-basis: 70px;
        }

        .brand-sub,
        .brand-name,
        .nav-item .label,
        .sidebar-foot {
          display: none;
        }

        .card-grid {
          grid-template-columns: 1fr;
        }

        #content {
          padding: 20px;
        }
      }
      .nav-icon {
        width: 20px;
        text-align: center;
        font-size: 16px;
        color: #8b93a1;
      }

      .nav-item.active .nav-icon {
        color: #a78bfa;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <span class="brand-dot"></span
            ><span class="brand-name">Nimbus</span>
          </div>
          <div class="brand-sub">Backend-connected console</div>
        </div>
        <nav id="navlist"></nav>
        <div class="sidebar-foot">ap-south-1 &middot; live API</div>
      </div>
      <div id="main">
        <div id="topbar">
          <div class="topbar-left">
            <div class="region-pill">Region: ap-south-1</div>
            <span id="awsPill" class="aws-pill off">Checking AWS...</span>
          </div>
          <div class="topbar-right">
            <span id="clock" class="mono"></span>
          </div>
        </div>
        <div id="content">Loading platform state…</div>
      </div>
    </div>

    <div class="modal-bg" id="confirmModal">
      <div class="modal">
        <h3 id="confirmTitle">Remove resource</h3>
        <div class="sub" id="confirmSub">This can't be undone.</div>
        <div class="modal-actions">
          <button class="btn" onclick="closeConfirm()">Cancel</button>
          <button class="btn btn-danger" id="confirmBtn">Remove</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      /* ---------------------------------------------------------------
   API layer — every mutation goes to the Express backend; state is
   re-fetched from the server (the real source of truth) afterward.
--------------------------------------------------------------- */
      let state = {
        compute: [],
        storage: [],
        database: [],
        network: [],
        users: [],
        groups: [],
        backups: [],
        crossRegion: true,
        log: [],
        awsLive: false,
      };

      async function api(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
          let msg = "Request failed";
          try {
            msg = (await res.json()).error || msg;
          } catch (e) {}
          throw new Error(msg);
        }
        return res.status === 204 ? null : res.json();
      }
      async function refreshState() {
        state = await api("GET", "/api/state");
        state.compute = await api("GET", "/api/compute");
        state.network = await api("GET", "/api/network");
        // Get real AWS RDS database data
        try {
          state.database = await api("GET", "/api/database");
        } catch (error) {
          console.error("RDS fetch failed:", error);
        }

        document.getElementById("awsPill").textContent = state.awsLive
          ? "Live AWS: connected"
          : "Live AWS: not configured";

        document.getElementById("awsPill").className =
          "aws-pill " + (state.awsLive ? "on" : "off");
      }

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._h);
        toast._h = setTimeout(() => t.classList.remove("show"), 2600);
      }
      async function run(action, successMsg, view) {
        try {
          await action();
          await refreshState();
          if (successMsg) toast(successMsg);
          goTo(view);
        } catch (err) {
          toast("Error: " + err.message);
        }
      }

      /* ---------------------------------------------------------------
   Navigation
--------------------------------------------------------------- */
      const NAV = [
        {
          id: "dashboard",
          label: "Dashboard",
          icon: "⌂",
          color: "var(--text2)",
        },
        { id: "compute", label: "Compute", icon: "▣", color: "var(--compute)" },
        { id: "storage", label: "Storage", icon: "◈", color: "var(--storage)" },
        {
          id: "database",
          label: "Database",
          icon: "◉",
          color: "var(--database)",
        },
        {
          id: "network",
          label: "Networking",
          icon: "⌁",
          color: "var(--network)",
        },
        {
          id: "security",
          label: "Security",
          icon: "◇",
          color: "var(--security)",
        },
        {
          id: "backup",
          label: "Backup & DR",
          icon: "↻",
          color: "var(--backup)",
        },
      ];
      function renderNav(activeId) {
        const nav = document.getElementById("navlist");
        nav.innerHTML = NAV.map(
          (n) => `
    <div class="nav-item ${n.id === activeId ? "active" : ""}" data-view="${n.id}">
      <span class="nav-icon">${n.icon}</span>
      <span class="label">${n.label}</span>
    </div>`,
        ).join("");
        nav.querySelectorAll(".nav-item").forEach((el) => {
          el.addEventListener("click", () => goTo(el.dataset.view));
        });
      }
      function goTo(view) {
        renderNav(view);
        document.getElementById("content").innerHTML = VIEWS[view]();
        attachViewHandlers();
      }

      /* ---------------------------------------------------------------
   Shared bits
--------------------------------------------------------------- */
      function statusDot(status) {
        const good = ["running", "available", "active"].includes(status);
        const warn = ["stopped", "paused"].includes(status);
        const color = good
          ? "var(--monitoring)"
          : warn
            ? "var(--security)"
            : "var(--danger)";
        return `<span class="status"><span class="dot" style="background:${color}"></span>${status}</span>`;
      }
      function viewHead(title, sub, actionLabel, actionColor) {
        return `<div class="view-head">
    <div><h1>${title}</h1><p>${sub}</p></div>
    ${actionLabel ? `<button class="btn btn-accent" id="primaryAction" style="--accent:${actionColor}">${actionLabel}</button>` : ""}
  </div>`;
      }
      let pendingDelete = null;
      function askDelete(title, sub, onConfirm) {
        pendingDelete = onConfirm;
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmSub").textContent = sub;
        document.getElementById("confirmModal").classList.add("active");
      }
      function closeConfirm() {
        document.getElementById("confirmModal").classList.remove("active");
        pendingDelete = null;
      }
      document.getElementById("confirmBtn").addEventListener("click", () => {
        if (pendingDelete) pendingDelete();
        closeConfirm();
      });
      function hideCreate() {
        const p = document.getElementById("createPanel");
        if (p) p.style.display = "none";
      }
      function attachViewHandlers() {
        const action = document.getElementById("primaryAction");
        if (action) {
          action.addEventListener("click", () => {
            const p = document.getElementById("createPanel");
            if (p)
              p.style.display = p.style.display === "none" ? "block" : "none";
          });
        }
      }

      /* ---------------------------------------------------------------
   Dashboard
--------------------------------------------------------------- */
      function dashboardView() {
        const counts = [
          {
            label: "Compute instances",
            n: state.compute.length,
            color: "var(--compute)",
          },
          {
            label: "Storage buckets",
            n: state.storage.length,
            color: "var(--storage)",
          },
          {
            label: "Database instances",
            n: state.database.length,
            color: "var(--database)",
          },
          { label: "VPCs", n: state.network.length, color: "var(--network)" },
          {
            label: "IAM users",
            n: state.users.length,
            color: "var(--security)",
          },
          {
            label: "Backups stored",
            n: state.backups.length,
            color: "var(--backup)",
          },
        ];
        return `
    ${viewHead("Platform overview", "A snapshot of every module, served live from the Express API.")}
    <div class="card-grid">
      ${counts
        .map(
          (c) => `
        <div class="stat-card">
          <div class="n">${c.n}</div>
          <div class="l">${c.label}</div>
          <div class="bar" style="background:${c.color}"></div>
        </div>`,
        )
        .join("")}
    </div>
    <div class="two-col">
      <div class="panel">
        <h3>Recent activity</h3>
        ${
          state.log.length
            ? `<table><tbody>
          ${state.log.map((l) => `<tr><td class="mono" style="color:var(--text3);width:90px;">${l.t}</td><td>${l.msg}</td></tr>`).join("")}
        </tbody></table>`
            : `<div class="empty">No activity yet — create a resource in any module to see it logged here.</div>`
        }
      </div>
      <div class="panel">
        <h3>Module health</h3>
        <table><tbody>
          <tr><td>Compute</td><td>${statusDot(state.compute.some((i) => i.status === "running") ? "running" : state.compute.length ? "stopped" : "active")}</td></tr>
          <tr><td>Database</td><td>${statusDot(state.database.length ? "available" : "stopped")}</td></tr>
          <tr><td>Networking</td><td>${statusDot("active")}</td></tr>
          <tr><td>Backup & DR</td><td>${statusDot(state.crossRegion ? "active" : "paused")}</td></tr>
        </tbody></table>
      </div>
    </div>
  `;
      }

      /* ---------------------------------------------------------------
   Compute
--------------------------------------------------------------- */
      function computeView() {
        return `
    ${viewHead("Compute", "Virtual machines and containers running your workloads.", "Launch instance", "var(--compute)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Launch instance</h3>
      <div class="form-row">
        <div class="field"><label>Name</label><input id="c_name" placeholder="e.g. api-server-2"></div>
        <div class="field"><label>Instance type</label>
          <select id="c_type"><option>t3.micro</option><option>t3.medium</option><option>t3.large</option><option>m5.xlarge</option></select>
        </div>
        <div class="field"><label>Availability zone</label>
          <select id="c_az"><option>ap-south-1a</option><option>ap-south-1b</option><option>ap-south-1c</option></select>
        </div>
      </div>
      <button class="btn btn-accent" style="--accent:var(--compute)" onclick="createInstance()">Launch</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    ${
      state.compute.length
        ? `
    <table><thead><tr><th>Instance ID</th><th>Name</th><th>Type</th><th>AZ</th><th>Status</th><th></th></tr></thead>
    <tbody>${state.compute
      .map(
        (i) => `
      <tr>
        <td class="mono">${i.id}</td><td>${i.name}</td><td>${i.itype}</td><td>${i.az}</td>
        <td>${statusDot(i.status)}</td>
        <td style="text-align:right;">
          <button class="btn btn-sm" onclick="toggleInstance('${i.id}')">${i.status === "running" ? "Stop" : "Start"}</button>
          <button class="btn btn-sm btn-danger" onclick="removeInstance('${i.id}')">Terminate</button>
        </td>
      </tr>`,
      )
      .join("")}</tbody></table>`
        : `<div class="empty">No instances yet. Launch one to see it here.</div>`
    }
  `;
      }
      function createInstance() {
        const name =
          document.getElementById("c_name").value.trim() || "instance";
        const itype = document.getElementById("c_type").value;
        const az = document.getElementById("c_az").value;
        run(
          () => api("POST", "/api/compute", { name, itype, az }),
          "Instance launched",
          "compute",
        );
      }
      function toggleInstance(id) {
        run(() => api("PATCH", `/api/compute/${id}/toggle`), null, "compute");
      }
      function removeInstance(id) {
        askDelete(
          "Terminate instance?",
          `${id} will be permanently removed.`,
          () => {
            run(
              () => api("DELETE", `/api/compute/${id}`),
              "Instance terminated",
              "compute",
            );
          },
        );
      }

      /* ---------------------------------------------------------------
   Storage
--------------------------------------------------------------- */
      function storageView() {
        return `
    ${viewHead("Storage", "Object, block and file storage for platform data.", "Create bucket", "var(--storage)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Create bucket</h3>
      <div class="form-row">
        <div class="field"><label>Bucket name</label><input id="s_name" placeholder="e.g. invoice-archive"></div>
        <div class="field"><label>Type</label>
          <select id="s_kind"><option>Object (S3-style)</option><option>Block volume</option><option>Shared file system</option></select>
        </div>
        <div class="field"><label>Size (GB)</label><input id="s_size" type="number" value="50" min="1"></div>
      </div>
      <div class="note">${state.awsLive ? 'AWS is connected — "Object (S3-style)" buckets are created for real in your S3 account.' : "AWS isn't configured on this server — buckets will be simulated in the database. Add credentials to .env to make this real."}</div>
      <br/>
      <button class="btn btn-accent" style="--accent:var(--storage)" onclick="createBucket()">Create</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    ${
      state.storage.length
        ? `
    <table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Size</th><th>Region</th><th>Source</th><th></th></tr></thead>
    <tbody>${state.storage
      .map(
        (s) => `
      <tr>
        <td class="mono">${s.bucketName || s.id}</td><td>${s.name}</td><td>${s.kind}</td><td>${s.sizeGB} GB</td><td>${s.region}</td>
        <td>${s.live ? '<span class="chip" style="color:var(--monitoring);border-color:var(--monitoring);">real S3</span>' : '<span class="chip">simulated</span>'}</td>
        <td style="text-align:right;"><button class="btn btn-sm btn-danger" onclick="removeStorage('${s.id}')">Delete</button></td>
      </tr>`,
      )
      .join("")}</tbody></table>`
        : `<div class="empty">No storage resources yet.</div>`
    }
  `;
      }
      function createBucket() {
        const name = document.getElementById("s_name").value.trim() || "bucket";
        const kind = document.getElementById("s_kind").value;
        const sizeGB = Number(document.getElementById("s_size").value) || 10;
        run(
          () => api("POST", "/api/storage", { name, kind, sizeGB }),
          "Bucket created",
          "storage",
        );
      }
      function removeStorage(id) {
        askDelete(
          "Delete storage resource?",
          `${id} and its contents will be permanently removed.`,
          () => {
            run(
              () => api("DELETE", `/api/storage/${id}`),
              "Deleted",
              "storage",
            );
          },
        );
      }

      /* ---------------------------------------------------------------
   Database
--------------------------------------------------------------- */
      function databaseView() {
        return `
    ${viewHead("Database", "Managed relational and NoSQL instances.", "Create database", "var(--database)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Create database</h3>
      <div class="form-row">
        <div class="field"><label>Name</label><input id="d_name" placeholder="e.g. analytics"></div>
        <div class="field"><label>Engine</label>
          <select id="d_engine"><option>PostgreSQL</option><option>MySQL</option><option>DynamoDB (NoSQL)</option><option>Redis (cache)</option></select>
        </div>
        <div class="field"><label>Multi-AZ</label>
          <select id="d_maz"><option value="true">Enabled</option><option value="false">Disabled</option></select>
        </div>
      </div>
      <button class="btn btn-accent" style="--accent:var(--database)" onclick="createDb()">Create</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    ${
      state.database.length
        ? `
    <table><thead><tr><th>ID</th><th>Name</th><th>Engine</th><th>Multi-AZ</th><th>Status</th><th></th></tr></thead>
    <tbody>${state.database
      .map(
        (d) => `
      <tr>
        <td class="mono">${d.id}</td><td>${d.name}</td><td>${d.engine}</td>
        <td>${d.multiAZ ? '<span class="chip">enabled</span>' : '<span class="chip">disabled</span>'}</td>
        <td>${statusDot(d.status)}</td>
        <td style="text-align:right;"><button class="btn btn-sm btn-danger" onclick="removeDb('${d.id}')">Delete</button></td>
      </tr>`,
      )
      .join("")}</tbody></table>`
        : `<div class="empty">No database instances yet.</div>`
    }
  `;
      }
      function createDb() {
        const name =
          document.getElementById("d_name").value.trim() || "database";
        const engine = document.getElementById("d_engine").value;
        const multiAZ = document.getElementById("d_maz").value === "true";
        run(
          () => api("POST", "/api/database", { name, engine, multiAZ }),
          "Database created",
          "database",
        );
      }
      function removeDb(id) {
        askDelete(
          "Delete database?",
          `${id} will be permanently removed. Consider taking a snapshot first.`,
          () => {
            run(
              () => api("DELETE", `/api/database/${id}`),
              "Deleted",
              "database",
            );
          },
        );
      }

      /* ---------------------------------------------------------------
   Networking
--------------------------------------------------------------- */
      function networkView() {
        return `
    ${viewHead("Networking", "Virtual networks, subnets and traffic routing.", "Create VPC", "var(--network)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Create VPC</h3>
      <div class="form-row">
        <div class="field"><label>Name</label><input id="n_name" placeholder="e.g. staging-vpc"></div>
        <div class="field"><label>CIDR block</label><input id="n_cidr" placeholder="10.30.0.0/16" value="10.30.0.0/16"></div>
        <div class="field"><label>Subnets</label><input id="n_subnets" type="number" value="2" min="1" max="12"></div>
      </div>
      <button class="btn btn-accent" style="--accent:var(--network)" onclick="createVpc()">Create</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    ${
      state.network.length
        ? `
    <table><thead><tr><th>ID</th><th>Name</th><th>CIDR</th><th>Subnets</th><th></th></tr></thead>
    <tbody>${state.network
      .map(
        (v) => `
      <tr>
        <td class="mono">${v.id}</td><td>${v.name}</td><td class="mono">${v.cidr}</td><td>${v.subnets}</td>
        <td style="text-align:right;"><button class="btn btn-sm btn-danger" onclick="removeVpc('${v.id}')">Delete</button></td>
      </tr>`,
      )
      .join("")}</tbody></table>`
        : `<div class="empty">No VPCs yet.</div>`
    }
  `;
      }
      function createVpc() {
        const name = document.getElementById("n_name").value.trim() || "vpc";
        const cidr =
          document.getElementById("n_cidr").value.trim() || "10.0.0.0/16";
        const subnets = Number(document.getElementById("n_subnets").value) || 2;
        run(
          () => api("POST", "/api/network", { name, cidr, subnets }),
          "VPC created",
          "network",
        );
      }
      function removeVpc(id) {
        askDelete(
          "Delete VPC?",
          `${id} and its subnets will be permanently removed.`,
          () => {
            run(
              () => api("DELETE", `/api/network/${id}`),
              "Deleted",
              "network",
            );
          },
        );
      }

      /* ---------------------------------------------------------------
   Security
--------------------------------------------------------------- */
      function securityView() {
        return `
    ${viewHead("Security", "Identity, access policies and network security groups.", "Add user", "var(--security)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Add IAM user</h3>
      <div class="form-row">
        <div class="field"><label>Name</label><input id="u_name" placeholder="e.g. data-team"></div>
        <div class="field"><label>Role</label>
          <select id="u_role"><option>Administrator</option><option>Developer</option><option>Read-only</option><option>Billing</option></select>
        </div>
      </div>
      <button class="btn btn-accent" style="--accent:var(--security)" onclick="createUser()">Add user</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    <div class="two-col">
      <div class="panel">
        <h3>IAM users</h3>
        ${
          state.users.length
            ? `<table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th></th></tr></thead>
        <tbody>${state.users
          .map(
            (u) => `
          <tr><td class="mono">${u.id}</td><td>${u.name}</td><td><span class="chip">${u.role}</span></td>
          <td style="text-align:right;"><button class="btn btn-sm btn-danger" onclick="removeUser('${u.id}')">Remove</button></td></tr>`,
          )
          .join("")}
        </tbody></table>`
            : `<div class="empty">No users yet.</div>`
        }
      </div>
      <div class="panel">
        <h3>Security groups</h3>
        ${
          state.groups.length
            ? `<table><thead><tr><th>Name</th><th>Rule</th></tr></thead>
        <tbody>${state.groups.map((g) => `<tr><td>${g.name}</td><td class="mono" style="color:var(--text2);">${g.rule}</td></tr>`).join("")}</tbody></table>`
            : `<div class="empty">No security groups yet.</div>`
        }
      </div>
    </div>
  `;
      }
      function createUser() {
        const name = document.getElementById("u_name").value.trim() || "user";
        const role = document.getElementById("u_role").value;
        run(
          () => api("POST", "/api/security/users", { name, role }),
          "User added",
          "security",
        );
      }
      function removeUser(id) {
        askDelete("Remove user?", `${id} will lose access immediately.`, () => {
          run(
            () => api("DELETE", `/api/security/users/${id}`),
            "Removed",
            "security",
          );
        });
      }

      /* ---------------------------------------------------------------
   Backup & DR
--------------------------------------------------------------- */
      function backupView() {
        const sources = [
          ...state.compute.map((i) => ({
            id: i.id,
            label: `${i.name} (compute)`,
          })),
          ...state.database.map((d) => ({
            id: d.id,
            label: `${d.name} (database)`,
          })),
          ...state.storage.map((s) => ({
            id: s.id,
            label: `${s.name} (storage)`,
          })),
        ];
        return `
    ${viewHead("Backup & disaster recovery", "Snapshots and cross-region replication for platform data.", "Take snapshot", "var(--backup)")}
    <div class="panel" id="createPanel" style="display:none;">
      <h3>Take snapshot</h3>
      <div class="form-row">
        <div class="field" style="flex:2;"><label>Source resource</label>
          <select id="b_source">${sources.length ? sources.map((s) => `<option value="${s.id}|${s.label}">${s.label}</option>`).join("") : "<option disabled>No resources available</option>"}</select>
        </div>
      </div>
      <button class="btn btn-accent" style="--accent:var(--backup)" onclick="createSnapshot()" ${sources.length ? "" : "disabled"}>Take snapshot</button>
      <button class="btn" onclick="hideCreate()">Cancel</button>
    </div>
    <div class="panel" style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h3 style="margin-bottom:2px;">Cross-region replication</h3>
        <div style="color:var(--text2);font-size:13px;">Replicate new snapshots to a second AWS region for disaster recovery.</div>
      </div>
      <button class="btn ${state.crossRegion ? "btn-accent" : ""}" style="--accent:var(--backup)" onclick="toggleCrossRegion()">${state.crossRegion ? "Enabled" : "Disabled"}</button>
    </div>
    ${
      state.backups.length
        ? `
    <table><thead><tr><th>Snapshot ID</th><th>Source</th><th>Created</th><th>Replicated</th><th></th></tr></thead>
    <tbody>${state.backups
      .map(
        (b) => `
      <tr>
        <td class="mono">${b.id}</td><td>${b.sourceLabel}</td><td>${b.createdAt}</td>
        <td>${b.crossRegion ? '<span class="chip">cross-region</span>' : '<span class="chip">single-region</span>'}</td>
        <td style="text-align:right;"><button class="btn btn-sm btn-danger" onclick="removeSnapshot('${b.id}')">Delete</button></td>
      </tr>`,
      )
      .join("")}</tbody></table>`
        : `<div class="empty">No snapshots yet. Take one from an existing resource.</div>`
    }
  `;
      }
      function createSnapshot() {
        const sel = document.getElementById("b_source").value;
        if (!sel) return;
        const [sourceId, sourceLabel] = sel.split("|");
        run(
          () => api("POST", "/api/backups", { sourceId, sourceLabel }),
          "Snapshot created",
          "backup",
        );
      }
      function removeSnapshot(id) {
        askDelete(
          "Delete snapshot?",
          `${id} will be permanently removed.`,
          () => {
            run(() => api("DELETE", `/api/backups/${id}`), "Deleted", "backup");
          },
        );
      }
      function toggleCrossRegion() {
        run(
          () => api("PATCH", "/api/backups/cross-region/toggle"),
          null,
          "backup",
        );
      }

      const VIEWS = {
        dashboard: dashboardView,
        compute: computeView,
        storage: storageView,
        database: databaseView,
        network: networkView,
        security: securityView,
        backup: backupView,
      };

      /* ---------------------------------------------------------------
   Boot
--------------------------------------------------------------- */
      function tickClock() {
        document.getElementById("clock").textContent =
          new Date().toLocaleTimeString();
      }
      setInterval(tickClock, 1000);
      tickClock();

      (async function boot() {
        try {
          await refreshState();
          goTo("dashboard");
        } catch (err) {
          document.getElementById("content").innerHTML =
            `<div class="empty">Couldn't reach the backend API. Make sure the server is running (npm start) and refresh this page.</div>`;
        }
      })();
    </script>
  </body>
</html>
